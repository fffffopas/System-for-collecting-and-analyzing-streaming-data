services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: dota-clickhouse
    ports:
      - "${CLICKHOUSE_PORT:-9001}:9000" # native-протокол (clickhouse-driver)
      - "8123:8123" # HTTP (удобно для curl и DataGrip)
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-default}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-dota}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-dota}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  clickhouse_data:
